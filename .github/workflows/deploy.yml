name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build app ban hang (POS)
        run: |
          npm ci
          npm run build

      - name: Build app hoc tieng Trung
        working-directory: chinese-app
        run: |
          npm ci
          npm run build

      - name: Ghep 2 app vao chung mot lan deploy
        run: |
          mkdir -p dist/hoc-tieng-trung
          cp -r chinese-app/dist/. dist/hoc-tieng-trung/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
